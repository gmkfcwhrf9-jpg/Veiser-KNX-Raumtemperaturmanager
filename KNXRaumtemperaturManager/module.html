
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    background:transparent;
    color:var(--text-color,#f4f4f7);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
}

button{
    font:inherit;
    cursor:pointer;
}

.wrap{
    width:100%;
    padding:12px 14px 8px;
}

.dial{
    position:relative;
    max-width:410px;
    margin:0 auto;
    aspect-ratio:1.23;
}

.dial svg{
    width:100%;
    height:100%;
    overflow:visible;
    touch-action:none;
}

.track{
    fill:none;
    stroke:#43434b;
    stroke-width:7;
    stroke-linecap:round;
}

.rainbow{
    fill:none;
    stroke:url(#heat);
    stroke-width:7;
    stroke-linecap:round;
}

.knob{
    fill:#a18ba0;
    stroke:#33343c;
    stroke-width:2;
}

.center{
    position:absolute;
    left:0;
    right:0;
    top:45%;
    transform:translateY(-50%);
    text-align:center;
    pointer-events:none;
}

.actual{
    font-size:clamp(12px,3.4vw,17px);
    opacity:.8;
}

.target{
    font-size:clamp(29px,8vw,45px);
    font-weight:500;
    letter-spacing:-1.4px;
}

.current{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

.modes{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
    margin-top:-5px;
}

.mode{
    background:rgba(130,130,145,.09);
    border:1px solid rgba(160,160,170,.22);
    color:inherit;
    border-radius:12px;
    min-width:0;
    padding:10px 3px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
}

.mode.active{
    border-color:#37adff;
    background:rgba(43,149,226,.17);
    box-shadow:inset 0 0 0 1px rgba(43,149,226,.35);
}

.mode .ico{
    font-size:22px;
}

.mode .name{
    font-size:clamp(10px,2.6vw,13px);
    font-weight:600;
}

.mode .temp{
    font-size:11px;
    opacity:.65;
}

.dial svg:focus{
    outline:none;
}

@media(max-width:360px){
    .wrap{padding:8px}
    .modes{gap:4px}
    .mode{padding:8px 1px}
    .dial{max-width:300px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="dial">
    <svg id="wheel"
         viewBox="0 0 340 290"
         role="slider"
         aria-label="Solltemperatur einstellen"
         aria-valuemin="5"
         aria-valuemax="35"
         tabindex="0">

        <defs>
            <linearGradient id="heat"
                            x1="0%" y1="75%"
                            x2="100%" y2="15%">
                <stop offset="0%" stop-color="#12b9fa"/>
                <stop offset="45%" stop-color="#308ed9"/>
                <stop offset="75%" stop-color="#aa7385"/>
                <stop offset="100%" stop-color="#df5336"/>
            </linearGradient>
        </defs>

        <path id="arc" class="track"/>
        <path id="colorArc" class="rainbow"/>
        <g id="ticks"></g>
        <circle id="knob" class="knob" r="11"/>
    </svg>

    <div class="center">
        <div class="actual" id="actual">🌡 20,0 °C</div>
        <div class="target" id="target">20,0 °C</div>
        <div class="current" id="current">☀ Komfort</div>
    </div>
</div>

<div class="modes" id="modes">

    <button class="mode" data-mode="1">
        <span class="ico">☀️</span>
        <span class="name">Komfort</span>
        <span class="temp" id="t1"></span>
    </button>

    <button class="mode" data-mode="2">
        <span class="ico">☾</span>
        <span class="name">Nacht</span>
        <span class="temp" id="t2"></span>
    </button>

    <button class="mode" data-mode="3">
        <span class="ico">⌂</span>
        <span class="name">Abwesend</span>
        <span class="temp" id="t3"></span>
    </button>

    <button class="mode" data-mode="4">
        <span class="ico">❄</span>
        <span class="name">Frostschutz</span>
        <span class="temp" id="t4"></span>
    </button>

</div>
</div>

<script>
let state=__INITIAL_STATE__;

const $=id=>document.getElementById(id);

const fmt=v=>
    Number(v).toFixed(1).replace('.',',')+' °C';

const modes=[
    '',
    'Komfort',
    'Nacht',
    'Abwesend',
    'Frostschutz'
];

const icons=['','☀','☾','⌂','❄'];

const center={x:170,y:162};
const radius=145;
const minAngle=135;
const maxAngle=405;

function point(a){
    const r=a*Math.PI/180;
    return {
        x:center.x+radius*Math.cos(r),
        y:center.y+radius*Math.sin(r)
    };
}

function path(a,b){
    const p=point(a);
    const q=point(b);

    return `M ${p.x} ${p.y} A ${radius} ${radius} 0 ${b-a>180?1:0} 1 ${q.x} ${q.y}`;
}

$('arc').setAttribute('d',path(minAngle,maxAngle));
$('colorArc').setAttribute('d',path(minAngle,maxAngle));

for(let a=minAngle;a<=maxAngle;a+=13.5){
    const p=point(a);

    const dot=document.createElementNS(
        'http://www.w3.org/2000/svg',
        'circle'
    );

    dot.setAttribute('cx',p.x);
    dot.setAttribute('cy',p.y);
    dot.setAttribute('r','2.6');
    dot.setAttribute('fill','#7c7e89');

    $('ticks').appendChild(dot);
}

function render(){
    const v=Math.max(
        5,
        Math.min(35,Number(state.setpoint)||20)
    );

    const angle=minAngle+
        (v-5)/30*(maxAngle-minAngle);

    const p=point(angle);

    $('knob').setAttribute('cx',p.x);
    $('knob').setAttribute('cy',p.y);

    $('actual').textContent=
        '🌡 '+fmt(state.feedback);

    $('target').textContent=fmt(v);

    $('current').textContent=
        (icons[state.mode]||'')+' '+
        (modes[state.mode]||'Unbekannt');

    $('wheel').setAttribute('aria-valuenow',v);
    $('wheel').setAttribute('aria-valuetext',fmt(v));

    [
        state.comfort,
        state.night,
        state.away,
        state.frost
    ].forEach((value,i)=>{
        $('t'+(i+1)).textContent=fmt(value);
    });

    document.querySelectorAll('.mode').forEach(button=>{
        const active=
            Number(button.dataset.mode)===
            Number(state.mode);

        button.classList.toggle('active',active);
        button.setAttribute('aria-pressed',String(active));
    });
}

function send(ident,value){
    if(typeof requestAction==='function'){
        requestAction(ident,value);
    }else{
        console.warn(
            'Nur in IP-Symcon bedienbar',
            ident,value
        );
    }
}

function setTemp(value){
    value=Math.round(
        Math.max(5,Math.min(35,value))*2
    )/2;

    state.setpoint=value;
    render();

    send('ManualSetpoint',value);
}

document.querySelectorAll('.mode').forEach(button=>{
    button.addEventListener('click',()=>{
        const mode=Number(button.dataset.mode);

        state.mode=mode;

        state.setpoint=[
            0,
            state.comfort,
            state.night,
            state.away,
            state.frost
        ][mode];

        render();
        send('OperatingMode',mode);
    });
});

let dragging=false;
const wheel=$('wheel');

function fromPointer(event){
    const rect=wheel.getBoundingClientRect();

    const x=(event.clientX-rect.left)*
        340/rect.width-center.x;

    const y=(event.clientY-rect.top)*
        290/rect.height-center.y;

    let angle=Math.atan2(y,x)*180/Math.PI;

    if(angle<0)angle+=360;
    if(angle<minAngle)angle+=360;

    angle=Math.max(
        minAngle,
        Math.min(maxAngle,angle)
    );

    return Math.round(
        (5+(angle-minAngle)/270*30)*2
    )/2;
}

wheel.addEventListener('pointerdown',event=>{
    dragging=true;
    wheel.setPointerCapture(event.pointerId);

    state.setpoint=fromPointer(event);
    render();
});

wheel.addEventListener('pointermove',event=>{
    if(dragging){
        state.setpoint=fromPointer(event);
        render();
    }
});

wheel.addEventListener('pointerup',event=>{
    if(dragging){
        dragging=false;
        setTemp(fromPointer(event));
    }
});

wheel.addEventListener('pointercancel',()=>{
    dragging=false;
});

wheel.addEventListener('keydown',event=>{
    if(event.key==='ArrowUp'||
       event.key==='ArrowRight'){
        event.preventDefault();
        setTemp(Number(state.setpoint)+0.5);
    }

    if(event.key==='ArrowDown'||
       event.key==='ArrowLeft'){
        event.preventDefault();
        setTemp(Number(state.setpoint)-0.5);
    }
});

function handleMessage(data){
    try{
        const parsed=
            typeof data==='string'?
            JSON.parse(data):data;

        if(parsed&&typeof parsed==='object'){
            state={...state,...parsed};
            render();
        }
    }catch(error){
        console.error(error);
    }
}

render();
</script>
</body>
</html>
